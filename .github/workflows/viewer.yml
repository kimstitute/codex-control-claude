name: viewer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: viewer-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ccc-viewer-x86_64-unknown-linux-gnu
            binary: ccc-viewer
            test: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ccc-viewer-x86_64-pc-windows-msvc.exe
            binary: ccc-viewer.exe
            test: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: ccc-viewer-aarch64-pc-windows-msvc.exe
            binary: ccc-viewer.exe
            test: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: ccc-viewer-x86_64-apple-darwin
            binary: ccc-viewer
            test: true
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: ccc-viewer-aarch64-apple-darwin
            binary: ccc-viewer
            test: true
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Run tests
        if: matrix.test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: viewer/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: viewer-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ccc-viewer-*
          merge-multiple: true

      - name: Generate checksums and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("dist")
          files = sorted(path for path in root.glob("ccc-viewer-*") if path.is_file())
          artifacts = []
          lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
              artifacts.append({"name": path.name, "sha256": digest, "size": path.stat().st_size})
          (root / "SHA256SUMS.viewer").write_text("\n".join(lines) + "\n", encoding="ascii")
          (root / "viewer-release-manifest.json").write_text(
              json.dumps(
                  {
                      "protocol": 1,
                      "tag": os.environ["RELEASE_TAG"],
                      "commit": os.environ["RELEASE_COMMIT"],
                      "artifacts": artifacts,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/ccc-viewer-*"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes
          gh release upload "$tag" dist/* --clobber
